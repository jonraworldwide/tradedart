name: Claude Collaborator

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body || '', '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body || '', '@claude')) ||
      github.event_name == 'pull_request_review_comment' ||
      github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout TRADEDART
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude collaborator
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 20
            --allowedTools "Bash(npm install),Bash(npm ci),Bash(npm test),Bash(npm run test),Bash(npm run build),Bash(npm run typecheck),Bash(git status),Bash(git diff),Read,Edit,Write,Glob,Grep"
            --append-system-prompt "You are a TRADEDART collaborating engineering agent. Read CLAUDE.md, ARCHITECTURE.md, docs/TRADEDART_CANONICAL.md and BUILD_STATE.json before making changes. Obey layer boundaries and GREEN/AMBER/RED authority. Live execution and withdrawals are RED and locked. Never claim PASS without executed acceptance evidence. Work through tests, branches and pull requests and leave auditable evidence."
